name: 📱 Bouw APK (Build APK)

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Bouw debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Code ophalen (Checkout)
        uses: actions/checkout@v4

      - name: ☕ Java 17 opzetten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🤖 Android SDK opzetten
        uses: android-actions/setup-android@v3

      - name: 🐘 Gradle opzetten
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: 🔨 APK bouwen (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: 📦 APK uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: morse-leren-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: 🚀 Release aanmaken (alleen bij tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Morse Leren ${{ github.ref_name }}
          body: |
            ## 📻 Morse Leren ${{ github.ref_name }}

            Download **app-debug.apk** hieronder en installeer op je Android-telefoon.

            **Installeren:**
            1. Download de APK op je telefoon
            2. Tik op het bestand → Sta "installeren uit onbekende bronnen" toe
            3. Tik op Installeren → Open de app 📻

            **EN:** Download app-debug.apk below and install on your Android phone.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
